<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img"
  style="font-family: ui-sans-serif, system-ui, sans-serif; background: transparent;">
  <title>A cross-encoder representation belongs to the text pair</title>
  <desc>The same document about water near a sandy edge is paired with two different queries: river bank and bank loan. Each joined pair passes through a cross-encoder and produces a different pair representation and score. There is no single document vector shared by both computations.</desc>

  <defs>
    <style>
      @keyframes focus-a {
        0%, 42%, 100% { stroke-width: 2.4; }
        52%, 90% { stroke-width: 0.9; }
      }
      @keyframes focus-b {
        0%, 42%, 100% { stroke-width: 0.9; }
        52%, 90% { stroke-width: 2.4; }
      }
      @keyframes flow-pair {
        to { stroke-dashoffset: -22; }
      }
      @keyframes result-pulse {
        0%, 100% { stroke-width: 1; }
        50% { stroke-width: 2.5; }
      }
      .pair-a-focus { animation: focus-a 7s ease-in-out infinite; }
      .pair-b-focus { animation: focus-b 7s ease-in-out infinite; }
      .pair-flow, .result-flow {
        stroke-dasharray: 6 4;
        animation: flow-pair 1.2s linear infinite;
      }
      .pair-b-flow { animation-delay: -0.6s; }
      .result-flow { animation-duration: 1.6s; }
      .result-card { animation: result-pulse 3.5s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .pair-a-focus, .pair-b-focus,
        .pair-flow, .result-flow, .result-card {
          animation: none !important;
        }
      }
    </style>
    <marker id="arrow-pair" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="380" y="27" text-anchor="middle"
    style="font-size:15px; font-weight:600; fill:#C9C5BC;">
    The representation belongs to the pair
  </text>
  <text x="380" y="49" text-anchor="middle"
    style="font-size:12px; fill:#B4AEA3;">
    Keep the document fixed, change the query, and the joint representation changes.
  </text>

  <rect class="pair-a-focus" x="28" y="72" width="334" height="277" rx="13"
    fill="#F8F6F0" stroke="#D9D4C8" stroke-width="1"/>
  <rect class="pair-b-focus" x="398" y="72" width="334" height="277" rx="13"
    fill="#F8F6F0" stroke="#D9D4C8" stroke-width="1"/>

  <text x="195" y="96" text-anchor="middle"
    style="font-size:12px; font-weight:600; fill:#26215C;">PAIR A</text>
  <text x="565" y="96" text-anchor="middle"
    style="font-size:12px; font-weight:600; fill:#26215C;">PAIR B</text>

  <rect class="pair-a-focus" x="52" y="112" width="124" height="42" rx="8"
    fill="#EEEDFE" stroke="#534AB7" stroke-width="0.9"/>
  <text x="114" y="129" text-anchor="middle"
    style="font-size:9px; font-weight:600; fill:#534AB7;">QUERY</text>
  <text x="114" y="145" text-anchor="middle"
    style="font-size:11px; font-weight:500; fill:#26215C;">river bank</text>
  <rect x="187" y="112" width="151" height="42" rx="8"
    fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/>
  <text x="262.5" y="129" text-anchor="middle"
    style="font-size:9px; font-weight:600; fill:#0F6E56;">SAME DOCUMENT</text>
  <text x="262.5" y="145" text-anchor="middle"
    style="font-size:10px; font-weight:500; fill:#04342C;">water · sandy · edge</text>

  <rect class="pair-b-focus" x="422" y="112" width="124" height="42" rx="8"
    fill="#EEEDFE" stroke="#534AB7" stroke-width="0.9"/>
  <text x="484" y="129" text-anchor="middle"
    style="font-size:9px; font-weight:600; fill:#534AB7;">QUERY</text>
  <text x="484" y="145" text-anchor="middle"
    style="font-size:11px; font-weight:500; fill:#26215C;">bank loan</text>
  <rect x="557" y="112" width="151" height="42" rx="8"
    fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/>
  <text x="632.5" y="129" text-anchor="middle"
    style="font-size:9px; font-weight:600; fill:#0F6E56;">SAME DOCUMENT</text>
  <text x="632.5" y="145" text-anchor="middle"
    style="font-size:10px; font-weight:500; fill:#04342C;">water · sandy · edge</text>

  <line class="pair-flow" x1="195" y1="154" x2="195" y2="177" stroke="#534AB7"
    stroke-width="1.2" marker-end="url(#arrow-pair)"/>
  <line class="pair-flow pair-b-flow" x1="565" y1="154" x2="565" y2="177" stroke="#534AB7"
    stroke-width="1.2" marker-end="url(#arrow-pair)"/>

  <rect class="pair-a-focus" x="68" y="180" width="254" height="62" rx="10"
    fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="195" y="204" text-anchor="middle"
    style="font-size:12px; font-weight:600; fill:#26215C;">Cross-encoder</text>
  <text x="195" y="224" text-anchor="middle"
    style="font-size:10px; fill:#534AB7;">joint context for query A + document</text>
  <rect class="pair-b-focus" x="438" y="180" width="254" height="62" rx="10"
    fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="565" y="204" text-anchor="middle"
    style="font-size:12px; font-weight:600; fill:#26215C;">Cross-encoder</text>
  <text x="565" y="224" text-anchor="middle"
    style="font-size:10px; fill:#534AB7;">joint context for query B + document</text>

  <line class="pair-flow" x1="195" y1="242" x2="195" y2="261" stroke="#993C1D"
    stroke-width="1.2" marker-end="url(#arrow-pair)"/>
  <line class="pair-flow pair-b-flow" x1="565" y1="242" x2="565" y2="261" stroke="#993C1D"
    stroke-width="1.2" marker-end="url(#arrow-pair)"/>

  <rect class="pair-a-focus" x="73" y="264" width="118" height="54" rx="9"
    fill="#FAECE7" stroke="#993C1D" stroke-width="0.9"/>
  <text x="132" y="285" text-anchor="middle"
    style="font-size:11px; font-weight:600; fill:#4A1B0C; font-family:ui-monospace, monospace;">h_A</text>
  <text x="132" y="303" text-anchor="middle"
    style="font-size:9px; fill:#993C1D;">pair representation A</text>
  <rect class="pair-a-focus" x="202" y="264" width="115" height="54" rx="9"
    fill="#FAEEDA" stroke="#BA7517" stroke-width="0.9"/>
  <text x="259.5" y="285" text-anchor="middle"
    style="font-size:11px; font-weight:600; fill:#633806; font-family:ui-monospace, monospace;">score s_A</text>
  <text x="259.5" y="303" text-anchor="middle"
    style="font-size:9px; fill:#854F0B;">for this pair</text>

  <rect class="pair-b-focus" x="443" y="264" width="118" height="54" rx="9"
    fill="#FAECE7" stroke="#993C1D" stroke-width="0.9"/>
  <text x="502" y="285" text-anchor="middle"
    style="font-size:11px; font-weight:600; fill:#4A1B0C; font-family:ui-monospace, monospace;">h_B</text>
  <text x="502" y="303" text-anchor="middle"
    style="font-size:9px; fill:#993C1D;">pair representation B</text>
  <rect class="pair-b-focus" x="572" y="264" width="115" height="54" rx="9"
    fill="#FAEEDA" stroke="#BA7517" stroke-width="0.9"/>
  <text x="629.5" y="285" text-anchor="middle"
    style="font-size:11px; font-weight:600; fill:#633806; font-family:ui-monospace, monospace;">score s_B</text>
  <text x="629.5" y="303" text-anchor="middle"
    style="font-size:9px; fill:#854F0B;">for this pair</text>

  <path class="result-flow" d="M132 318 C155 346 281 351 325 365" fill="none"
    stroke="#993C1D" stroke-width="1.3" marker-end="url(#arrow-pair)"/>
  <path class="result-flow" d="M502 318 C478 346 438 351 435 365" fill="none"
    stroke="#993C1D" stroke-width="1.3" marker-end="url(#arrow-pair)"/>

  <rect class="result-card" x="263" y="361" width="234" height="49" rx="10"
    fill="#F1EFE8" stroke="#BDB9AF" stroke-width="1"/>
  <text x="380" y="381" text-anchor="middle"
    style="font-size:12px; font-weight:600; fill:#4A4944; font-family:ui-monospace, monospace;">h_A ≠ h_B</text>
  <text x="380" y="399" text-anchor="middle"
    style="font-size:10px; fill:#888780;">same document, but no single shared document vector</text>

  <text x="380" y="425" text-anchor="middle"
    style="font-size:10px; fill:#888780; font-style:italic;">
    The values are symbolic: the diagram shows dependency, not invented relevance numbers.
  </text>
</svg>
