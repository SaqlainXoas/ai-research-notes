<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img"
  style="font-family: ui-sans-serif, system-ui, sans-serif; background: transparent;">
  <title>Token order changes sentence meaning</title>
  <desc>Two rows compare The dog chased the cat with The cat chased the dog. Dog and cat exchange positions, so the actor and receiver also exchange roles even though the main tokens are the same.</desc>

  <defs>
    <style>
      @keyframes swap-left {
        0%, 18% { transform: translateX(0); }
        48%, 68% { transform: translateX(448px); }
        100% { transform: translateX(0); }
      }
      @keyframes swap-right {
        0%, 18% { transform: translateX(0); }
        48%, 68% { transform: translateX(-448px); }
        100% { transform: translateX(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .swap-left, .swap-right { animation: none !important; }
      }
      .swap-left { animation: swap-left 5s ease-in-out infinite; }
      .swap-right { animation: swap-right 5s ease-in-out infinite; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="380" y="28" text-anchor="middle"
    style="font-size:15px; font-weight:600; fill:#C9C5BC;">
    Same main tokens, different order, different meaning
  </text>
  <text x="380" y="50" text-anchor="middle"
    style="font-size:12px; fill:#B4AEA3;">
    Position tells the model who performs the action and who receives it.
  </text>

  <text x="50" y="107" style="font-size:11px; font-weight:600; fill:#888780;">Sentence A</text>
  <rect x="50" y="118" width="660" height="58" rx="11"
    fill="#F8F6F0" stroke="#D9D4C8" stroke-width="1"/>

  <rect x="72" y="130" width="64" height="34" rx="7" fill="#F1EFE8" stroke="#BDB9AF" stroke-width="0.7"/>
  <text x="104" y="151" text-anchor="middle" style="font-size:13px; fill:#4A4944;">The</text>
  <rect x="158" y="128" width="90" height="38" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
  <text x="203" y="151" text-anchor="middle" style="font-size:14px; font-weight:600; fill:#26215C;">dog</text>
  <text x="203" y="190" text-anchor="middle" style="font-size:10px; fill:#534AB7;">actor</text>
  <rect x="270" y="130" width="116" height="34" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="328" y="151" text-anchor="middle" style="font-size:13px; font-weight:500; fill:#04342C;">chased</text>
  <rect x="408" y="130" width="64" height="34" rx="7" fill="#F1EFE8" stroke="#BDB9AF" stroke-width="0.7"/>
  <text x="440" y="151" text-anchor="middle" style="font-size:13px; fill:#4A4944;">the</text>
  <rect x="494" y="128" width="90" height="38" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.4"/>
  <text x="539" y="151" text-anchor="middle" style="font-size:14px; font-weight:600; fill:#633806;">cat</text>
  <text x="539" y="190" text-anchor="middle" style="font-size:10px; fill:#BA7517;">receiver</text>
  <text x="616" y="151" style="font-size:16px; fill:#888780;">.</text>

  <path d="M203 199 Q371 232 539 199" fill="none" stroke="#B4B2A9" stroke-width="1.2"
    stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="371" y="225" text-anchor="middle" style="font-size:10px; fill:#888780;">change the positions</text>

  <text x="50" y="255" style="font-size:11px; font-weight:600; fill:#888780;">Sentence B</text>
  <rect x="50" y="266" width="660" height="58" rx="11"
    fill="#F8F6F0" stroke="#D9D4C8" stroke-width="1"/>

  <rect x="72" y="278" width="64" height="34" rx="7" fill="#F1EFE8" stroke="#BDB9AF" stroke-width="0.7"/>
  <text x="104" y="299" text-anchor="middle" style="font-size:13px; fill:#4A4944;">The</text>
  <g class="swap-left" style="transform-origin:203px 295px;">
    <rect x="158" y="276" width="90" height="38" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.4"/>
    <text x="203" y="299" text-anchor="middle" style="font-size:14px; font-weight:600; fill:#633806;">cat</text>
  </g>
  <rect x="270" y="278" width="116" height="34" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="328" y="299" text-anchor="middle" style="font-size:13px; font-weight:500; fill:#04342C;">chased</text>
  <rect x="408" y="278" width="64" height="34" rx="7" fill="#F1EFE8" stroke="#BDB9AF" stroke-width="0.7"/>
  <text x="440" y="299" text-anchor="middle" style="font-size:13px; fill:#4A4944;">the</text>
  <g class="swap-right" style="transform-origin:539px 295px;">
    <rect x="494" y="276" width="90" height="38" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
    <text x="539" y="299" text-anchor="middle" style="font-size:14px; font-weight:600; fill:#26215C;">dog</text>
  </g>
  <text x="616" y="299" style="font-size:16px; fill:#888780;">.</text>
</svg>
