<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img"
  style="font-family: ui-sans-serif, system-ui, sans-serif;">
  <title>Contrastive learning shapes a vector space</title>
  <desc>An anchor called river bank erosion is drawn close to a positive river-edge passage. A hard negative about bank loans and an easy negative about cake are pushed away with distinct arrows.</desc>
  <defs>
    <marker id="arrow-close" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#087660" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-away" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#B33A16" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#D8DEE4" stroke-width="0.8"/></pattern>
  </defs>

  <rect x="8" y="8" width="744" height="444" rx="18" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/>
  <text x="380" y="46" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#24292F;">Contrastive learning changes which examples become close</text>
  <text x="380" y="70" text-anchor="middle" style="font-size:13px;fill:#57606A;">The aim is not keyword overlap; it is the task-relevant relationship.</text>

  <rect x="45" y="98" width="670" height="286" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/>
  <rect x="45" y="98" width="670" height="286" rx="14" fill="url(#grid)" opacity=".78"/>
  <path d="M94 344H666 M121 360V126" fill="none" stroke="#8C959F" stroke-width="1.3"/>
  <text x="670" y="349" text-anchor="end" style="font-size:11px;fill:#57606A;">embedding dimension 1</text>
  <text x="126" y="134" style="font-size:11px;fill:#57606A;">embedding dimension 2</text>

  <path d="M362 252 C405 223 450 201 495 173" fill="none" stroke="#087660" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#arrow-close)"/>
  <rect x="398" y="190" width="120" height="28" rx="14" fill="#E6F6F0"/>
  <text x="458" y="209" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#075B4A;">pull closer</text>

  <path d="M333 255 C287 245 260 219 231 185" fill="none" stroke="#B33A16" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow-away)"/>
  <rect x="207" y="208" width="108" height="28" rx="14" fill="#FFF0EB"/>
  <text x="261" y="227" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#8C2D12;">push apart</text>

  <path d="M337 278 C278 310 225 319 170 313" fill="none" stroke="#B33A16" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow-away)"/>
  <rect x="206" y="327" width="108" height="28" rx="14" fill="#FFF0EB"/>
  <text x="260" y="346" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#8C2D12;">push apart</text>

  <circle cx="351" cy="262" r="17" fill="#2563EB" stroke="#174EA6" stroke-width="2"/>
  <circle cx="510" cy="166" r="16" fill="#16A34A" stroke="#087633" stroke-width="2"/>
  <circle cx="214" cy="167" r="16" fill="#D97706" stroke="#A85A00" stroke-width="2"/>
  <circle cx="153" cy="314" r="16" fill="#B33A16" stroke="#8C2D12" stroke-width="2"/>

  <rect x="292" y="286" width="170" height="50" rx="10" fill="#EAF1FF" stroke="#2563EB"/>
  <text x="377" y="307" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#174EA6;">ANCHOR</text>
  <text x="377" y="325" text-anchor="middle" style="font-size:13px;fill:#174EA6;">river bank erosion</text>

  <rect x="495" y="112" width="177" height="50" rx="10" fill="#E6F6F0" stroke="#087660"/>
  <text x="583" y="133" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#075B4A;">POSITIVE</text>
  <text x="583" y="151" text-anchor="middle" style="font-size:12px;fill:#075B4A;">river-edge soil loss</text>

  <rect x="122" y="110" width="174" height="50" rx="10" fill="#FFF7E6" stroke="#D97706"/>
  <text x="209" y="131" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#8A4B00;">HARD NEGATIVE</text>
  <text x="209" y="149" text-anchor="middle" style="font-size:12px;fill:#8A4B00;">bank loan interest rates</text>

  <rect x="84" y="347" width="165" height="50" rx="10" fill="#FFF0EB" stroke="#B33A16"/>
  <text x="166" y="368" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#8C2D12;">EASY NEGATIVE</text>
  <text x="166" y="386" text-anchor="middle" style="font-size:12px;fill:#8C2D12;">chocolate cake recipe</text>

  <rect x="113" y="407" width="534" height="26" rx="13" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="380" y="425" text-anchor="middle" style="font-size:12px;fill:#57606A;">The hard negative shares “bank,” so the model must learn the complete meaning of the query.</text>
</svg>
