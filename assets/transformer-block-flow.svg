<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" role="img"
  style="font-family: ui-sans-serif, system-ui, sans-serif; background: transparent;">
  <title>Inside an original-style Transformer block</title>
  <desc>An input representation passes through attention, residual addition and layer normalization, then a position-wise feed-forward network, a second residual addition and layer normalization, and becomes an updated representation. Curved bypass arrows show both residual paths.</desc>

  <defs>
    <style>
      @keyframes flow-block { to { stroke-dashoffset: -20; } }
      @keyframes pulse-add {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
      .main-flow { stroke-dasharray: 6 4; animation: flow-block 1.35s linear infinite; }
      .add-node { transform-box: fill-box; transform-origin: center; animation: pulse-add 2.8s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .main-flow, .add-node { animation: none !important; }
      }
    </style>
    <marker id="arrow-block" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="380" y="28" text-anchor="middle"
    style="font-size:16px; font-weight:600; fill:#888780;">Inside one Transformer block</text>
  <text x="380" y="50" text-anchor="middle"
    style="font-size:11px; fill:#888780;">Two different transformations, each supported by a residual route.</text>

  <rect x="265" y="70" width="230" height="46" rx="10"
    fill="#F8F6F0" stroke="#D9D4C8" stroke-width="1"/>
  <text x="380" y="98" text-anchor="middle"
    style="font-size:13px; font-weight:600; fill:#3D3C38;">Input representations</text>

  <line class="main-flow" x1="380" y1="116" x2="380" y2="143"
    stroke="#534AB7" stroke-width="1.4" marker-end="url(#arrow-block)"/>

  <rect x="245" y="147" width="270" height="62" rx="11"
    fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="380" y="174" text-anchor="middle"
    style="font-size:14px; font-weight:600; fill:#26215C;">Multi-head attention</text>
  <text x="380" y="195" text-anchor="middle"
    style="font-size:11px; fill:#534AB7;">mix information across token positions</text>

  <line class="main-flow" x1="380" y1="209" x2="380" y2="239"
    stroke="#534AB7" stroke-width="1.4" marker-end="url(#arrow-block)"/>
  <path d="M265 93 C155 93 155 249 352 249" fill="none"
    stroke="#BA7517" stroke-width="1.5" stroke-dasharray="5 4"
    marker-end="url(#arrow-block)"/>
  <text x="166" y="172" text-anchor="middle"
    style="font-size:10px; font-weight:500; fill:#BA7517;">residual path</text>
  <text x="166" y="188" text-anchor="middle"
    style="font-size:9px; fill:#888780;">carry the input around attention</text>

  <g class="add-node">
    <circle cx="380" cy="249" r="17" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
    <text x="380" y="255" text-anchor="middle"
      style="font-size:18px; font-weight:600; fill:#633806;">+</text>
  </g>

  <line class="main-flow" x1="380" y1="266" x2="380" y2="286"
    stroke="#888780" stroke-width="1.3" marker-end="url(#arrow-block)"/>
  <rect x="270" y="290" width="220" height="44" rx="9"
    fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="380" y="317" text-anchor="middle"
    style="font-size:13px; font-weight:600; fill:#3D3C38;">Layer normalization</text>

  <line class="main-flow" x1="380" y1="334" x2="380" y2="361"
    stroke="#0F6E56" stroke-width="1.4" marker-end="url(#arrow-block)"/>
  <rect x="245" y="365" width="270" height="62" rx="11"
    fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="380" y="392" text-anchor="middle"
    style="font-size:14px; font-weight:600; fill:#04342C;">Position-wise FFN</text>
  <text x="380" y="413" text-anchor="middle"
    style="font-size:11px; fill:#0F6E56;">transform each token independently</text>

  <line class="main-flow" x1="380" y1="427" x2="380" y2="457"
    stroke="#0F6E56" stroke-width="1.4" marker-end="url(#arrow-block)"/>
  <path d="M270 312 C165 312 165 467 352 467" fill="none"
    stroke="#BA7517" stroke-width="1.5" stroke-dasharray="5 4"
    marker-end="url(#arrow-block)"/>
  <text x="174" y="391" text-anchor="middle"
    style="font-size:10px; font-weight:500; fill:#BA7517;">residual path</text>
  <text x="174" y="407" text-anchor="middle"
    style="font-size:9px; fill:#888780;">carry the sublayer input around the FFN</text>

  <g class="add-node">
    <circle cx="380" cy="467" r="17" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
    <text x="380" y="473" text-anchor="middle"
      style="font-size:18px; font-weight:600; fill:#633806;">+</text>
  </g>

  <line class="main-flow" x1="380" y1="484" x2="380" y2="501"
    stroke="#888780" stroke-width="1.3" marker-end="url(#arrow-block)"/>
  <rect x="265" y="505" width="230" height="42" rx="9"
    fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="380" y="531" text-anchor="middle"
    style="font-size:13px; font-weight:600; fill:#3D3C38;">Layer normalization → output</text>

  <text x="380" y="565" text-anchor="middle"
    style="font-size:9px; fill:#888780;">Original-style Post-LN ordering shown; many modern models move normalization before each sublayer.</text>
</svg>
