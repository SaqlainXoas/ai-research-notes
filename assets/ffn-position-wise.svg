<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" style="font-family: ui-sans-serif, system-ui, sans-serif;">
  <title>Position-wise feed-forward network uses the same weights for each token</title>
  <desc>Three token representations labelled Token A, Token B, and Token C pass horizontally and independently through three visual instances of the same shared feed-forward network. They become A prime, B prime, and C prime. There are no arrows between token paths.</desc>
  <defs>
    <marker id="arrow-ffn-position" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="864" height="484" rx="18" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/>
  <text x="440" y="48" text-anchor="middle" style="font-size:18px; font-weight:700; fill:#24292F;">Position-wise means every token uses the same FFN separately</text>
  <text x="440" y="72" text-anchor="middle" style="font-size:13px; fill:#57606A;">The paths run in parallel: the FFN has shared weights, but no token-to-token arrows inside it.</text>

  <rect x="238" y="95" width="404" height="35" rx="17" fill="#F0EAFF" stroke="#D8C9FF" stroke-width="1"/>
  <text x="440" y="118" text-anchor="middle" style="font-size:13px; font-weight:700; fill:#5A32A3;">ONE SHARED FFN PARAMETER SET: W₁, b₁, W₂, b₂</text>

  <text x="111" y="163" text-anchor="middle" style="font-size:11px; font-weight:700; fill:#57606A; letter-spacing:.6px;">INPUT TOKEN</text>
  <text x="440" y="163" text-anchor="middle" style="font-size:11px; font-weight:700; fill:#5A32A3; letter-spacing:.6px;">SAME FFN, APPLIED INDEPENDENTLY</text>
  <text x="770" y="163" text-anchor="middle" style="font-size:11px; font-weight:700; fill:#075B4A; letter-spacing:.6px;">OUTPUT TOKEN</text>

  <g>
    <rect x="48" y="185" width="126" height="68" rx="12" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.2"/>
    <text x="111" y="212" text-anchor="middle" style="font-size:15px; font-weight:700; fill:#24292F;">Token A</text>
    <text x="111" y="234" text-anchor="middle" style="font-size:12px; fill:#57606A;">representation A</text>
    <path d="M174 219 H260" fill="none" stroke="#57606A" stroke-width="1.8" marker-end="url(#arrow-ffn-position)"/>
    <rect x="268" y="180" width="344" height="78" rx="13" fill="#F0EAFF" stroke="#5A32A3" stroke-width="1.4"/>
    <text x="440" y="210" text-anchor="middle" style="font-size:15px; font-weight:700; fill:#2D1B54;">FFN</text>
    <text x="440" y="234" text-anchor="middle" style="font-size:12px; fill:#5A32A3;">same learned transformation</text>
    <path d="M612 219 H698" fill="none" stroke="#5A32A3" stroke-width="1.8" marker-end="url(#arrow-ffn-position)"/>
    <rect x="706" y="185" width="126" height="68" rx="12" fill="#E6F6F0" stroke="#087660" stroke-width="1.2"/>
    <text x="769" y="212" text-anchor="middle" style="font-size:15px; font-weight:700; fill:#075B4A;">Token A′</text>
    <text x="769" y="234" text-anchor="middle" style="font-size:12px; fill:#075B4A;">updated A</text>
  </g>

  <g>
    <rect x="48" y="301" width="126" height="68" rx="12" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.2"/>
    <text x="111" y="328" text-anchor="middle" style="font-size:15px; font-weight:700; fill:#24292F;">Token B</text>
    <text x="111" y="350" text-anchor="middle" style="font-size:12px; fill:#57606A;">representation B</text>
    <path d="M174 335 H260" fill="none" stroke="#57606A" stroke-width="1.8" marker-end="url(#arrow-ffn-position)"/>
    <rect x="268" y="296" width="344" height="78" rx="13" fill="#F0EAFF" stroke="#5A32A3" stroke-width="1.4"/>
    <text x="440" y="326" text-anchor="middle" style="font-size:15px; font-weight:700; fill:#2D1B54;">FFN</text>
    <text x="440" y="350" text-anchor="middle" style="font-size:12px; fill:#5A32A3;">same learned transformation</text>
    <path d="M612 335 H698" fill="none" stroke="#5A32A3" stroke-width="1.8" marker-end="url(#arrow-ffn-position)"/>
    <rect x="706" y="301" width="126" height="68" rx="12" fill="#E6F6F0" stroke="#087660" stroke-width="1.2"/>
    <text x="769" y="328" text-anchor="middle" style="font-size:15px; font-weight:700; fill:#075B4A;">Token B′</text>
    <text x="769" y="350" text-anchor="middle" style="font-size:12px; fill:#075B4A;">updated B</text>
  </g>

  <g>
    <rect x="48" y="417" width="126" height="52" rx="12" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.2"/>
    <text x="111" y="448" text-anchor="middle" style="font-size:15px; font-weight:700; fill:#24292F;">Token C</text>
    <path d="M174 443 H260" fill="none" stroke="#57606A" stroke-width="1.8" marker-end="url(#arrow-ffn-position)"/>
    <rect x="268" y="412" width="344" height="62" rx="13" fill="#F0EAFF" stroke="#5A32A3" stroke-width="1.4"/>
    <text x="440" y="439" text-anchor="middle" style="font-size:15px; font-weight:700; fill:#2D1B54;">FFN</text>
    <text x="440" y="459" text-anchor="middle" style="font-size:11px; fill:#5A32A3;">same learned transformation</text>
    <path d="M612 443 H698" fill="none" stroke="#5A32A3" stroke-width="1.8" marker-end="url(#arrow-ffn-position)"/>
    <rect x="706" y="417" width="126" height="52" rx="12" fill="#E6F6F0" stroke="#087660" stroke-width="1.2"/>
    <text x="769" y="448" text-anchor="middle" style="font-size:15px; font-weight:700; fill:#075B4A;">Token C′</text>
  </g>
</svg>
