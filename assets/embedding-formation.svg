<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img"
  style="font-family: ui-sans-serif, system-ui, sans-serif; background: transparent;">
  <title>From tokens to one text embedding</title>
  <desc>The sentence river bank is split into tokens. Learned input vectors pass through a Transformer and become contextual token states. A pooling step combines those states into one fixed-size standalone text embedding.</desc>

  <defs>
    <style>
      @keyframes flow-embedding {
        to { stroke-dashoffset: -20; }
      }
      @keyframes stage-one-pulse {
        0%, 18% { stroke-width: 2.4; }
        25%, 100% { stroke-width: 1; }
      }
      @keyframes stage-two-pulse {
        0%, 20%, 48%, 100% { stroke-width: 1; }
        27%, 42% { stroke-width: 2.4; }
      }
      @keyframes stage-three-pulse {
        0%, 45%, 72%, 100% { stroke-width: 1; }
        52%, 66% { stroke-width: 2.4; }
      }
      @keyframes stage-four-pulse {
        0%, 68%, 100% { stroke-width: 1.1; opacity: 1; }
        76%, 91% { stroke-width: 2.7; opacity: 0.82; }
      }
      .flow-embedding, .context-flow {
        stroke-dasharray: 6 4;
        animation: flow-embedding 1.15s linear infinite;
      }
      .context-flow { animation-duration: 1.6s; }
      .stage-one { animation: stage-one-pulse 7s ease-in-out infinite; }
      .stage-two { animation: stage-two-pulse 7s ease-in-out infinite; }
      .stage-three { animation: stage-three-pulse 7s ease-in-out infinite; }
      .stage-four { animation: stage-four-pulse 7s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .flow-embedding, .context-flow,
        .stage-one, .stage-two, .stage-three, .stage-four {
          animation: none !important;
        }
      }
    </style>
    <marker id="arrow-embed" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="380" y="27" text-anchor="middle"
    style="font-size:15px; font-weight:600; fill:#C9C5BC;">
    From token representations to one text embedding
  </text>
  <text x="380" y="49" text-anchor="middle"
    style="font-size:12px; fill:#B4AEA3;">
    Contextualize every token first, then pool the sequence into one fixed-size vector.
  </text>

  <rect x="38" y="75" width="684" height="54" rx="10"
    fill="#F8F6F0" stroke="#D9D4C8" stroke-width="1"/>
  <text x="62" y="97" style="font-size:9px; font-weight:600; fill:#888780;">INPUT TEXT</text>
  <text x="380" y="109" text-anchor="middle"
    style="font-size:14px; font-weight:500; fill:#3D3C38; font-family:ui-monospace, monospace;">
    river bank
  </text>

  <line class="flow-embedding" x1="380" y1="129" x2="380" y2="150" stroke="#534AB7"
    stroke-width="1.2" marker-end="url(#arrow-embed)"/>

  <rect class="stage-one" x="34" y="154" width="198" height="132" rx="11"
    fill="#F8F6F0" stroke="#D9D4C8" stroke-width="1"/>
  <text x="133" y="179" text-anchor="middle"
    style="font-size:12px; font-weight:600; fill:#26215C;">Input embeddings</text>
  <text x="133" y="197" text-anchor="middle"
    style="font-size:10px; fill:#888780;">learned token starting points</text>
  <rect x="57" y="215" width="64" height="42" rx="8"
    fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="89" y="232" text-anchor="middle"
    style="font-size:11px; font-weight:500; fill:#26215C;">river</text>
  <text x="89" y="248" text-anchor="middle"
    style="font-size:9px; fill:#534AB7; font-family:ui-monospace, monospace;">e₁</text>
  <rect x="143" y="215" width="64" height="42" rx="8"
    fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="175" y="232" text-anchor="middle"
    style="font-size:11px; font-weight:500; fill:#26215C;">bank</text>
  <text x="175" y="248" text-anchor="middle"
    style="font-size:9px; fill:#534AB7; font-family:ui-monospace, monospace;">e₂</text>

  <line class="flow-embedding" x1="232" y1="220" x2="269" y2="220" stroke="#534AB7"
    stroke-width="1.2" marker-end="url(#arrow-embed)"/>

  <rect class="stage-two" x="271" y="154" width="218" height="132" rx="11"
    fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="380" y="179" text-anchor="middle"
    style="font-size:12px; font-weight:600; fill:#26215C;">Transformer encoder</text>
  <text x="380" y="197" text-anchor="middle"
    style="font-size:10px; fill:#534AB7;">tokens exchange context through attention</text>
  <rect x="294" y="215" width="78" height="42" rx="8"
    fill="#E7E5FA" stroke="#534AB7" stroke-width="0.8"/>
  <text x="333" y="232" text-anchor="middle"
    style="font-size:11px; font-weight:500; fill:#26215C;">river</text>
  <text x="333" y="248" text-anchor="middle"
    style="font-size:9px; fill:#534AB7; font-family:ui-monospace, monospace;">h₁|context</text>
  <rect x="388" y="215" width="78" height="42" rx="8"
    fill="#E7E5FA" stroke="#534AB7" stroke-width="0.8"/>
  <text x="427" y="232" text-anchor="middle"
    style="font-size:11px; font-weight:500; fill:#26215C;">bank</text>
  <text x="427" y="248" text-anchor="middle"
    style="font-size:9px; fill:#534AB7; font-family:ui-monospace, monospace;">h₂|context</text>
  <path class="context-flow" d="M341 211 C355 198 405 198 419 211" fill="none"
    stroke="#BA7517" stroke-width="1.4" marker-end="url(#arrow-embed)"/>

  <line class="flow-embedding" x1="489" y1="220" x2="526" y2="220" stroke="#BA7517"
    stroke-width="1.2" marker-end="url(#arrow-embed)"/>

  <rect class="stage-three" x="528" y="154" width="198" height="132" rx="11"
    fill="#F8F6F0" stroke="#D9D4C8" stroke-width="1"/>
  <text x="627" y="179" text-anchor="middle"
    style="font-size:12px; font-weight:600; fill:#633806;">Pooling</text>
  <text x="627" y="197" text-anchor="middle"
    style="font-size:10px; fill:#888780;">combine the contextual states</text>
  <rect x="560" y="215" width="134" height="42" rx="8"
    fill="#FAEEDA" stroke="#BA7517" stroke-width="0.8"/>
  <text x="627" y="232" text-anchor="middle"
    style="font-size:11px; font-weight:500; fill:#633806;">mean / [CLS] / learned</text>
  <text x="627" y="248" text-anchor="middle"
    style="font-size:9px; fill:#854F0B;">model-specific choice</text>

  <line class="flow-embedding" x1="620" y1="286" x2="620" y2="316" stroke="#BA7517"
    stroke-width="1.3" marker-end="url(#arrow-embed)"/>
  <rect class="stage-four" x="493" y="320" width="254" height="55" rx="11"
    fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.1"/>
  <text x="620" y="342" text-anchor="middle"
    style="font-size:12px; font-weight:600; fill:#04342C; font-family:ui-monospace, monospace;">
    v = one text embedding
  </text>
  <text x="620" y="361" text-anchor="middle"
    style="font-size:10px; fill:#0F6E56;">fixed size and independent of future comparisons</text>

  <rect x="50" y="319" width="381" height="56" rx="10"
    fill="#F1EFE8" stroke="#D9D4C8" stroke-width="0.8"/>
  <text x="240.5" y="341" text-anchor="middle"
    style="font-size:10px; font-weight:600; fill:#5F5E5A;">THE REPRESENTATION CHANGES AT EACH STAGE</text>
  <text x="240.5" y="360" text-anchor="middle"
    style="font-size:10px; fill:#888780;">token lookup ≠ contextual token state ≠ pooled text embedding</text>
</svg>
