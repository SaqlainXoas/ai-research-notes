<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" role="img"
  style="font-family: ui-sans-serif, system-ui, sans-serif;">
  <title>Residual connection with a learned branch and an identity shortcut</title>
  <desc>An input x splits into two paths. The learned residual branch computes F of x. The identity shortcut carries x unchanged. The paths meet at addition and produce y equals F of x plus x.</desc>

  <defs>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#57606A"
        stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-learned" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5A32A3"
        stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-shortcut" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#087660"
        stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Explicit card background keeps every label readable on GitHub light and dark themes. -->
  <rect x="8" y="8" width="864" height="394" rx="18" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/>

  <text x="440" y="48" text-anchor="middle"
    style="font-size:18px; font-weight:700; fill:#24292F;">A residual block learns an update, then adds it to its input</text>
  <text x="440" y="73" text-anchor="middle"
    style="font-size:13px; fill:#57606A;">The learned branch and the identity shortcut both contribute to the output.</text>

  <rect x="54" y="151" width="150" height="96" rx="13" fill="#F6F8FA" stroke="#8C959F" stroke-width="1.2"/>
  <text x="129" y="187" text-anchor="middle" style="font-size:15px; font-weight:700; fill:#24292F;">Input</text>
  <text x="129" y="221" text-anchor="middle" style="font-size:26px; font-weight:700; fill:#24292F;">x</text>

  <rect x="315" y="107" width="210" height="27" rx="13.5" fill="#F0EAFF"/>
  <text x="420" y="126" text-anchor="middle" style="font-size:12px; font-weight:700; fill:#5A32A3;">LEARNED RESIDUAL BRANCH</text>
  <path d="M204 194 H268 V182 H300" fill="none" stroke="#5A32A3" stroke-width="2" marker-end="url(#arrow-learned)"/>
  <rect x="300" y="145" width="240" height="87" rx="13" fill="#F0EAFF" stroke="#5A32A3" stroke-width="1.4"/>
  <text x="420" y="180" text-anchor="middle" style="font-size:15px; font-weight:700; fill:#2D1B54;">Learned transformation</text>
  <text x="420" y="211" text-anchor="middle" style="font-size:24px; font-weight:700; fill:#5A32A3;">F(x)</text>
  <path d="M540 188 H612 V207" fill="none" stroke="#5A32A3" stroke-width="2" marker-end="url(#arrow-learned)"/>

  <path d="M204 213 H254 V306 H612 V237" fill="none" stroke="#087660" stroke-width="2" marker-end="url(#arrow-shortcut)"/>
  <rect x="316" y="322" width="235" height="47" rx="12" fill="#E6F6F0" stroke="#087660" stroke-width="1"/>
  <text x="433" y="344" text-anchor="middle" style="font-size:13px; font-weight:700; fill:#075B4A;">Identity shortcut</text>
  <text x="433" y="360" text-anchor="middle" style="font-size:12px; fill:#075B4A;">passes x through unchanged</text>

  <circle cx="630" cy="221" r="32" fill="#FFF0EB" stroke="#B33A16" stroke-width="1.5"/>
  <path d="M616 221 H644 M630 207 V235" fill="none" stroke="#B33A16" stroke-width="2.4" stroke-linecap="round"/>
  <text x="630" y="272" text-anchor="middle" style="font-size:12px; font-weight:700; fill:#8C2D12;">addition</text>

  <path d="M662 221 H695" fill="none" stroke="#57606A" stroke-width="2" marker-end="url(#arrow-neutral)"/>
  <rect x="695" y="151" width="132" height="96" rx="13" fill="#E6F6F0" stroke="#087660" stroke-width="1.3"/>
  <text x="761" y="187" text-anchor="middle" style="font-size:15px; font-weight:700; fill:#075B4A;">Output</text>
  <text x="761" y="221" text-anchor="middle" style="font-size:26px; font-weight:700; fill:#075B4A;">y</text>

  <rect x="304" y="378" width="272" height="1" fill="#D0D7DE"/>
  <text x="440" y="399" text-anchor="middle" style="font-size:15px; font-weight:700; fill:#24292F;">y = F(x) + x</text>
</svg>
