<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img"
  style="font-family: ui-sans-serif, system-ui, sans-serif; background: transparent;">
  <title>Residual connection with a learned branch and an identity shortcut</title>
  <desc>An input x splits into two paths. The upper learned residual branch computes F of x. The lower identity shortcut carries x unchanged. The paths meet at an addition symbol and produce y equals F of x plus x.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-learned" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-shortcut" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      @media (prefers-reduced-motion: reduce) {
        .flow { animation: none !important; }
      }
      @keyframes flow-dash { to { stroke-dashoffset: -18; } }
      .flow { stroke-dasharray: 6 4; animation: flow-dash 1.5s linear infinite; }
    </style>
  </defs>

  <text x="440" y="34" text-anchor="middle"
    style="font-size:17px; font-weight:650; fill:#2C2C2A;">A residual block learns an update, then adds it to its input</text>
  <text x="440" y="57" text-anchor="middle"
    style="font-size:11px; fill:#888780;">Both paths contribute: the shortcut preserves x while the learned branch computes F(x).</text>

  <rect x="48" y="103" width="150" height="92" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="123" y="137" text-anchor="middle" style="font-size:14px; font-weight:600; fill:#2C2C2A;">Input</text>
  <text x="123" y="166" text-anchor="middle" style="font-size:25px; font-weight:650; fill:#2C2C2A;">x</text>

  <path d="M198 149 H248 V141 H288" fill="none" stroke="#534AB7" stroke-width="1.6" marker-end="url(#arrow-learned)"/>
  <path class="flow" d="M248 149 V347 H612 V248" fill="none" stroke="#0F6E56" stroke-width="1.7" marker-end="url(#arrow-shortcut)"/>

  <text x="244" y="111" text-anchor="middle" style="font-size:11px; font-weight:600; fill:#534AB7;">learned residual branch</text>
  <rect x="288" y="98" width="246" height="88" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="411" y="132" text-anchor="middle" style="font-size:15px; font-weight:650; fill:#26215C;">Transformation</text>
  <text x="411" y="160" text-anchor="middle" style="font-size:22px; font-weight:650; fill:#534AB7;">F(x)</text>

  <path class="flow" d="M534 142 H612 V202" fill="none" stroke="#534AB7" stroke-width="1.7" marker-end="url(#arrow-learned)"/>

  <text x="429" y="380" text-anchor="middle" style="font-size:11px; font-weight:600; fill:#0F6E56;">identity shortcut</text>
  <text x="429" y="400" text-anchor="middle" style="font-size:11px; fill:#0F6E56;">passes x through unchanged</text>

  <circle cx="630" cy="225" r="31" fill="#FAECE7" stroke="#993C1D" stroke-width="1.4"/>
  <path d="M616 225 H644 M630 211 V239" fill="none" stroke="#993C1D" stroke-width="2.2" stroke-linecap="round"/>
  <text x="630" y="278" text-anchor="middle" style="font-size:11px; fill:#993C1D;">add the paths</text>

  <path d="M661 225 H701" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="701" y="179" width="132" height="92" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="767" y="211" text-anchor="middle" style="font-size:14px; font-weight:600; fill:#04342C;">Output</text>
  <text x="767" y="242" text-anchor="middle" style="font-size:22px; font-weight:650; fill:#0F6E56;">y</text>

  <rect x="236" y="424" width="408" height="30" rx="8" fill="#F8F6F0" stroke="#D9D4C8" stroke-width="1"/>
  <text x="440" y="444" text-anchor="middle" style="font-size:14px; font-weight:600; fill:#2C2C2A;">y = F(x) + x</text>
</svg>
