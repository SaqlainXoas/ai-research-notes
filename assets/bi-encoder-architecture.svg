<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img"
  style="font-family: ui-sans-serif, system-ui, sans-serif; background: transparent;">
  <title>Bi-encoder architecture: separate encoding and reusable embeddings</title>
  <desc>A query with tokens river and bank and a document with tokens water, sandy, and edge travel through separate encoder passes with shared learned weights. Each sequence is pooled into an independent reusable vector. Cosine similarity or a dot product compares the two vectors only after encoding. A divider emphasizes that there is no query-document token interaction inside the encoders.</desc>

  <defs>
    <style>
      @keyframes flow-bi {
        to { stroke-dashoffset: -20; }
      }
      @keyframes encoder-pulse {
        0%, 100% { stroke-width: 1; }
        50% { stroke-width: 2.2; }
      }
      @keyframes vector-pulse {
        0%, 100% { stroke-width: 1; opacity: 1; }
        50% { stroke-width: 2.4; opacity: 0.82; }
      }
      @keyframes compare-pulse {
        0%, 100% { stroke-width: 1; }
        50% { stroke-width: 2.4; }
      }
      .flow-query, .flow-document, .flow-compare {
        stroke-dasharray: 6 4;
        animation: flow-bi 1.15s linear infinite;
      }
      .flow-document { animation-delay: -0.45s; }
      .flow-compare { animation-duration: 1.45s; }
      .encoder-query, .encoder-document {
        animation: encoder-pulse 3s ease-in-out infinite;
      }
      .encoder-document { animation-delay: -1.5s; }
      .vector-query, .vector-document {
        animation: vector-pulse 2.8s ease-in-out infinite;
      }
      .vector-document { animation-delay: -1.4s; }
      .compare-card { animation: compare-pulse 2.8s ease-in-out infinite 0.7s; }
      @media (prefers-reduced-motion: reduce) {
        .flow-query, .flow-document, .flow-compare,
        .encoder-query, .encoder-document,
        .vector-query, .vector-document, .compare-card {
          animation: none !important;
        }
      }
    </style>
    <marker id="arrow-bi" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="380" y="27" text-anchor="middle"
    style="font-size:15px; font-weight:600; fill:#C9C5BC;">
    Bi-encoder: build two independent, reusable embeddings
  </text>
  <text x="380" y="49" text-anchor="middle"
    style="font-size:12px; fill:#B4AEA3;">
    The texts are contextualized separately and meet only in the final vector comparison.
  </text>

  <rect x="28" y="70" width="326" height="308" rx="13"
    fill="#F8F6F0" stroke="#D9D4C8" stroke-width="1"/>
  <rect x="406" y="70" width="326" height="308" rx="13"
    fill="#F8F6F0" stroke="#D9D4C8" stroke-width="1"/>

  <text x="191" y="96" text-anchor="middle"
    style="font-size:13px; font-weight:600; fill:#26215C;">QUERY PASS</text>
  <text x="569" y="96" text-anchor="middle"
    style="font-size:13px; font-weight:600; fill:#04342C;">DOCUMENT PASS</text>

  <rect x="76" y="113" width="88" height="34" rx="8"
    fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="120" y="134" text-anchor="middle"
    style="font-size:12px; font-weight:500; fill:#26215C;">river</text>
  <rect x="174" y="113" width="88" height="34" rx="8"
    fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="218" y="134" text-anchor="middle"
    style="font-size:12px; font-weight:500; fill:#26215C;">bank</text>

  <rect x="442" y="113" width="76" height="34" rx="8"
    fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="480" y="134" text-anchor="middle"
    style="font-size:12px; font-weight:500; fill:#04342C;">water</text>
  <rect x="528" y="113" width="76" height="34" rx="8"
    fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="566" y="134" text-anchor="middle"
    style="font-size:12px; font-weight:500; fill:#04342C;">sandy</text>
  <rect x="614" y="113" width="76" height="34" rx="8"
    fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="652" y="134" text-anchor="middle"
    style="font-size:12px; font-weight:500; fill:#04342C;">edge</text>

  <line class="flow-query" x1="191" y1="147" x2="191" y2="169" stroke="#534AB7"
    stroke-width="1.2" marker-end="url(#arrow-bi)"/>
  <line class="flow-document" x1="569" y1="147" x2="569" y2="169" stroke="#0F6E56"
    stroke-width="1.2" marker-end="url(#arrow-bi)"/>

  <rect class="encoder-query" x="61" y="172" width="260" height="78" rx="10"
    fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="191" y="200" text-anchor="middle"
    style="font-size:13px; font-weight:600; fill:#26215C;">Transformer encoder</text>
  <text x="191" y="221" text-anchor="middle"
    style="font-size:11px; fill:#534AB7;">query tokens attend within the query</text>
  <text x="191" y="238" text-anchor="middle"
    style="font-size:10px; fill:#6D68A4;">separate forward pass</text>

  <rect class="encoder-document" x="439" y="172" width="260" height="78" rx="10"
    fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="569" y="200" text-anchor="middle"
    style="font-size:13px; font-weight:600; fill:#04342C;">Transformer encoder</text>
  <text x="569" y="221" text-anchor="middle"
    style="font-size:11px; fill:#0F6E56;">document tokens attend within the document</text>
  <text x="569" y="238" text-anchor="middle"
    style="font-size:10px; fill:#4D806F;">separate forward pass</text>

  <path d="M321 190 C350 158 410 158 439 190" fill="none"
    stroke="#BA7517" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="327" y="142" width="106" height="25" rx="7"
    fill="#FAEEDA" stroke="#BA7517" stroke-width="0.8"/>
  <text x="380" y="159" text-anchor="middle"
    style="font-size:10px; font-weight:500; fill:#633806;">shared weights</text>

  <line class="flow-query" x1="191" y1="250" x2="191" y2="271" stroke="#534AB7"
    stroke-width="1.2" marker-end="url(#arrow-bi)"/>
  <line class="flow-document" x1="569" y1="250" x2="569" y2="271" stroke="#0F6E56"
    stroke-width="1.2" marker-end="url(#arrow-bi)"/>

  <rect x="126" y="274" width="130" height="38" rx="8"
    fill="#F1EFE8" stroke="#BDB9AF" stroke-width="0.8"/>
  <text x="191" y="298" text-anchor="middle"
    style="font-size:11px; font-weight:500; fill:#4A4944;">pool query states</text>
  <rect x="504" y="274" width="130" height="38" rx="8"
    fill="#F1EFE8" stroke="#BDB9AF" stroke-width="0.8"/>
  <text x="569" y="298" text-anchor="middle"
    style="font-size:11px; font-weight:500; fill:#4A4944;">pool document states</text>

  <line class="flow-query" x1="191" y1="312" x2="191" y2="329" stroke="#534AB7"
    stroke-width="1.4" marker-end="url(#arrow-bi)"/>
  <line class="flow-document" x1="569" y1="312" x2="569" y2="329" stroke="#0F6E56"
    stroke-width="1.4" marker-end="url(#arrow-bi)"/>

  <rect class="vector-query" x="116" y="332" width="150" height="31" rx="8"
    fill="#E7E5FA" stroke="#534AB7" stroke-width="1"/>
  <text x="191" y="352" text-anchor="middle"
    style="font-size:12px; font-weight:600; fill:#26215C; font-family:ui-monospace, monospace;">u = query vector</text>
  <rect class="vector-document" x="494" y="332" width="150" height="31" rx="8"
    fill="#D8EFE7" stroke="#0F6E56" stroke-width="1"/>
  <text x="569" y="352" text-anchor="middle"
    style="font-size:12px; font-weight:600; fill:#04342C; font-family:ui-monospace, monospace;">v = document vector</text>

  <line x1="380" y1="177" x2="380" y2="365" stroke="#BDB9AF"
    stroke-width="1" stroke-dasharray="3 5"/>
  <rect x="319" y="256" width="122" height="38" rx="8"
    fill="#F8F6F0" stroke="#BDB9AF" stroke-width="0.8"/>
  <text x="380" y="272" text-anchor="middle"
    style="font-size:10px; font-weight:600; fill:#5F5E5A;">NO CROSS-TEXT</text>
  <text x="380" y="286" text-anchor="middle"
    style="font-size:10px; fill:#888780;">token interaction</text>

  <path class="flow-compare" d="M191 363 C191 393 283 391 307 404" fill="none"
    stroke="#534AB7" stroke-width="1.4" marker-end="url(#arrow-bi)"/>
  <path class="flow-compare" d="M569 363 C569 393 477 391 453 404" fill="none"
    stroke="#0F6E56" stroke-width="1.4" marker-end="url(#arrow-bi)"/>

  <rect class="compare-card" x="294" y="397" width="172" height="43" rx="10"
    fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="380" y="415" text-anchor="middle"
    style="font-size:12px; font-weight:600; fill:#633806;">cosine(u, v) or u · v</text>
  <text x="380" y="431" text-anchor="middle"
    style="font-size:10px; fill:#854F0B;">fast vector comparison</text>

  <text x="43" y="430" style="font-size:10px; font-weight:500; fill:#534AB7;">✓ one standalone vector per text</text>
  <text x="717" y="430" text-anchor="end" style="font-size:10px; font-weight:500; fill:#0F6E56;">✓ same document vector can be reused</text>
</svg>
