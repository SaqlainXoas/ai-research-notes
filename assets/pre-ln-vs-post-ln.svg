<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img"
  style="font-family: ui-sans-serif, system-ui, sans-serif; background: transparent;">
  <title>Pre-LN and Post-LN Transformer sublayer arrangements</title>
  <desc>Two side-by-side residual sublayer diagrams show the placement of LayerNorm. Post-LN applies LayerNorm after residual addition. Pre-LN applies LayerNorm before the learned sublayer, while the residual path continues directly to addition.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="440" y="31" text-anchor="middle" style="font-size:17px; font-weight:650; fill:#2C2C2A;">LayerNorm placement around a Transformer sublayer</text>
  <text x="440" y="53" text-anchor="middle" style="font-size:11px; fill:#888780;">The residual addition is present in both arrangements; only the position of normalization changes.</text>

  <rect x="28" y="78" width="398" height="330" rx="14" fill="#F8F6F0" stroke="#D9D4C8" stroke-width="1"/>
  <text x="227" y="108" text-anchor="middle" style="font-size:15px; font-weight:650; fill:#26215C;">Post-LN</text>
  <text x="227" y="127" text-anchor="middle" style="font-size:11px; fill:#534AB7;">normalize after residual addition</text>
  <rect x="171" y="145" width="112" height="37" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="227" y="168" text-anchor="middle" style="font-size:12px; font-weight:600; fill:#2C2C2A;">input x</text>
  <path d="M227 182 V204" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="151" y="210" width="152" height="50" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.1"/>
  <text x="227" y="240" text-anchor="middle" style="font-size:13px; font-weight:650; fill:#26215C;">Sublayer</text>
  <path d="M227 260 V279" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M171 164 H91 V297 H190" fill="none" stroke="#0F6E56" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="83" y="247" text-anchor="middle" style="font-size:10px; fill:#0F6E56;">residual</text>
  <circle cx="227" cy="297" r="27" fill="#FAECE7" stroke="#993C1D" stroke-width="1.3"/>
  <path d="M214 297 H240 M227 284 V310" fill="none" stroke="#993C1D" stroke-width="2" stroke-linecap="round"/>
  <path d="M227 324 V341" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="151" y="347" width="152" height="42" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.1"/>
  <text x="227" y="373" text-anchor="middle" style="font-size:13px; font-weight:650; fill:#04342C;">LayerNorm</text>

  <rect x="454" y="78" width="398" height="330" rx="14" fill="#F8F6F0" stroke="#D9D4C8" stroke-width="1"/>
  <text x="653" y="108" text-anchor="middle" style="font-size:15px; font-weight:650; fill:#26215C;">Pre-LN</text>
  <text x="653" y="127" text-anchor="middle" style="font-size:11px; fill:#534AB7;">normalize before the learned sublayer</text>
  <rect x="597" y="145" width="112" height="37" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="653" y="168" text-anchor="middle" style="font-size:12px; font-weight:600; fill:#2C2C2A;">input x</text>
  <path d="M653 182 V199" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="577" y="205" width="152" height="42" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.1"/>
  <text x="653" y="231" text-anchor="middle" style="font-size:13px; font-weight:650; fill:#04342C;">LayerNorm</text>
  <path d="M653 247 V266" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="577" y="272" width="152" height="50" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.1"/>
  <text x="653" y="302" text-anchor="middle" style="font-size:13px; font-weight:650; fill:#26215C;">Sublayer</text>
  <path d="M653 322 V341" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M597 164 H517 V359 H616" fill="none" stroke="#0F6E56" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="509" y="275" text-anchor="middle" style="font-size:10px; fill:#0F6E56;">residual</text>
  <circle cx="653" cy="359" r="27" fill="#FAECE7" stroke="#993C1D" stroke-width="1.3"/>
  <path d="M640 359 H666 M653 346 V372" fill="none" stroke="#993C1D" stroke-width="2" stroke-linecap="round"/>
  <text x="227" y="402" text-anchor="middle" style="font-size:10px; fill:#888780;">Sublayer → Add → LayerNorm</text>
  <text x="653" y="402" text-anchor="middle" style="font-size:10px; fill:#888780;">LayerNorm → Sublayer → Add</text>
</svg>
