<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img"
  style="font-family: ui-sans-serif, system-ui, sans-serif; background: transparent;">
  <title>LayerNorm computes statistics across the hidden features of each token</title>
  <desc>Two token hidden vectors each contain six features. A bracket spans the features in each row, leading to separate mean and variance statistics, LayerNorm, and a normalized output vector. The diagram makes clear that every token uses its own feature statistics.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="460" y="31" text-anchor="middle" style="font-size:17px; font-weight:650; fill:#2C2C2A;">LayerNorm normalizes each token across its hidden features</text>
  <text x="460" y="54" text-anchor="middle" style="font-size:11px; fill:#888780;">The rows run in parallel: statistics never mix values from different tokens.</text>

  <text x="414" y="91" text-anchor="middle" style="font-size:11px; font-weight:650; fill:#534AB7; letter-spacing:.7px;">HIDDEN / FEATURE DIMENSION</text>
  <path d="M188 103 H640" fill="none" stroke="#534AB7" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="656" y="107" style="font-size:11px; fill:#534AB7;">f₁ … f₆</text>

  <rect x="28" y="128" width="864" height="137" rx="14" fill="#F8F6F0" stroke="#D9D4C8" stroke-width="1"/>
  <text x="55" y="158" style="font-size:13px; font-weight:650; fill:#2C2C2A;">Token A</text>
  <text x="55" y="178" style="font-size:10px; fill:#888780;">one hidden representation</text>

  <g fill="#EEEDFE" stroke="#534AB7" stroke-width="1">
    <rect x="187" y="143" width="54" height="44" rx="8"/><rect x="247" y="143" width="54" height="44" rx="8"/>
    <rect x="307" y="143" width="54" height="44" rx="8"/><rect x="367" y="143" width="54" height="44" rx="8"/>
    <rect x="427" y="143" width="54" height="44" rx="8"/><rect x="487" y="143" width="54" height="44" rx="8"/>
  </g>
  <g text-anchor="middle" style="font-size:15px; font-weight:650; fill:#26215C; font-family:ui-monospace, monospace;">
    <text x="214" y="171">2</text><text x="274" y="171">4</text><text x="334" y="171">6</text><text x="394" y="171">8</text><text x="454" y="171">5</text><text x="514" y="171">3</text>
  </g>
  <path d="M187 198 V207 H541 V198" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round"/>
  <text x="364" y="226" text-anchor="middle" style="font-size:11px; fill:#534AB7;">calculate across this token’s features</text>
  <path d="M541 165 H621" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="627" y="137" width="118" height="56" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="686" y="160" text-anchor="middle" style="font-size:13px; font-weight:650; fill:#633806;">μA, σ²A</text>
  <text x="686" y="178" text-anchor="middle" style="font-size:10px; fill:#854F0B;">feature statistics</text>
  <path d="M745 165 H774" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="780" y="137" width="87" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="824" y="160" text-anchor="middle" style="font-size:12px; font-weight:650; fill:#04342C;">LayerNorm</text>
  <text x="824" y="178" text-anchor="middle" style="font-size:10px; fill:#0F6E56;">→ x̂A</text>

  <rect x="28" y="293" width="864" height="137" rx="14" fill="#F8F6F0" stroke="#D9D4C8" stroke-width="1"/>
  <text x="55" y="323" style="font-size:13px; font-weight:650; fill:#2C2C2A;">Token B</text>
  <text x="55" y="343" style="font-size:10px; fill:#888780;">a separate hidden representation</text>

  <g fill="#EEEDFE" stroke="#534AB7" stroke-width="1">
    <rect x="187" y="308" width="54" height="44" rx="8"/><rect x="247" y="308" width="54" height="44" rx="8"/>
    <rect x="307" y="308" width="54" height="44" rx="8"/><rect x="367" y="308" width="54" height="44" rx="8"/>
    <rect x="427" y="308" width="54" height="44" rx="8"/><rect x="487" y="308" width="54" height="44" rx="8"/>
  </g>
  <g text-anchor="middle" style="font-size:15px; font-weight:650; fill:#26215C; font-family:ui-monospace, monospace;">
    <text x="214" y="336">12</text><text x="274" y="336">3</text><text x="334" y="336">1</text><text x="394" y="336">9</text><text x="454" y="336">7</text><text x="514" y="336">5</text>
  </g>
  <path d="M187 363 V372 H541 V363" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round"/>
  <text x="364" y="391" text-anchor="middle" style="font-size:11px; fill:#534AB7;">calculate across this token’s features</text>
  <path d="M541 330 H621" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="627" y="302" width="118" height="56" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="686" y="325" text-anchor="middle" style="font-size:13px; font-weight:650; fill:#633806;">μB, σ²B</text>
  <text x="686" y="343" text-anchor="middle" style="font-size:10px; fill:#854F0B;">feature statistics</text>
  <path d="M745 330 H774" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="780" y="302" width="87" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="824" y="325" text-anchor="middle" style="font-size:12px; font-weight:650; fill:#04342C;">LayerNorm</text>
  <text x="824" y="343" text-anchor="middle" style="font-size:10px; fill:#0F6E56;">→ x̂B</text>

  <rect x="230" y="447" width="460" height="24" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="460" y="464" text-anchor="middle" style="font-size:11px; font-weight:650; fill:#2C2C2A;">Each token uses its own feature statistics</text>
</svg>
