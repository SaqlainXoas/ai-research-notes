<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 445" role="img"
  style="font-family: ui-sans-serif, system-ui, sans-serif; background: transparent;">
  <title>Original Transformer encoder-decoder flow</title>
  <desc>Source tokens pass through an encoder stack to become contextual source states. Earlier target tokens pass through a causal decoder stack. A cross-attention arrow carries encoder states into the decoder, which predicts the next target token.</desc>

  <defs>
    <style>
      @keyframes flow-original { to { stroke-dashoffset: -20; } }
      .flow-original { stroke-dasharray: 6 4; animation: flow-original 1.35s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        .flow-original { animation: none !important; }
      }
    </style>
    <marker id="arrow-original" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="380" y="28" text-anchor="middle"
    style="font-size:16px; font-weight:600; fill:#888780;">The original Transformer: encoder + decoder</text>
  <text x="380" y="50" text-anchor="middle"
    style="font-size:11px; fill:#888780;">The encoder represents the source; the decoder generates while consulting those representations.</text>

  <text x="190" y="79" text-anchor="middle"
    style="font-size:10px; font-weight:600; fill:#888780;">SOURCE SIDE</text>
  <rect x="75" y="90" width="230" height="44" rx="9"
    fill="#F8F6F0" stroke="#D9D4C8" stroke-width="1"/>
  <text x="190" y="117" text-anchor="middle"
    style="font-size:13px; font-weight:600; fill:#3D3C38;">Source tokens</text>

  <line class="flow-original" x1="190" y1="134" x2="190" y2="157"
    stroke="#0F6E56" stroke-width="1.4" marker-end="url(#arrow-original)"/>
  <rect x="55" y="161" width="270" height="148" rx="12"
    fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="190" y="187" text-anchor="middle"
    style="font-size:14px; font-weight:600; fill:#04342C;">Encoder stack × N</text>
  <rect x="85" y="202" width="210" height="38" rx="8"
    fill="#F4FBF8" stroke="#79BFA8" stroke-width="0.8"/>
  <text x="190" y="226" text-anchor="middle"
    style="font-size:11px; font-weight:500; fill:#0F6E56;">self-attention over source tokens</text>
  <rect x="85" y="253" width="210" height="38" rx="8"
    fill="#F4FBF8" stroke="#79BFA8" stroke-width="0.8"/>
  <text x="190" y="277" text-anchor="middle"
    style="font-size:11px; font-weight:500; fill:#0F6E56;">position-wise FFN</text>

  <line class="flow-original" x1="190" y1="309" x2="190" y2="332"
    stroke="#0F6E56" stroke-width="1.4" marker-end="url(#arrow-original)"/>
  <rect x="70" y="336" width="240" height="48" rx="9"
    fill="#F8F6F0" stroke="#0F6E56" stroke-width="1"/>
  <text x="190" y="356" text-anchor="middle"
    style="font-size:12px; font-weight:600; fill:#04342C;">Contextual source states</text>
  <text x="190" y="373" text-anchor="middle"
    style="font-size:9px; fill:#0F6E56;">one output representation per source token</text>

  <text x="570" y="79" text-anchor="middle"
    style="font-size:10px; font-weight:600; fill:#888780;">TARGET SIDE</text>
  <rect x="455" y="90" width="230" height="44" rx="9"
    fill="#F8F6F0" stroke="#D9D4C8" stroke-width="1"/>
  <text x="570" y="109" text-anchor="middle"
    style="font-size:13px; font-weight:600; fill:#3D3C38;">Earlier target tokens</text>
  <text x="570" y="124" text-anchor="middle"
    style="font-size:9px; fill:#888780;">shifted right during training</text>

  <line class="flow-original" x1="570" y1="134" x2="570" y2="157"
    stroke="#534AB7" stroke-width="1.4" marker-end="url(#arrow-original)"/>
  <rect x="435" y="161" width="270" height="148" rx="12"
    fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="570" y="187" text-anchor="middle"
    style="font-size:14px; font-weight:600; fill:#26215C;">Decoder stack × N</text>
  <rect x="465" y="199" width="210" height="29" rx="7"
    fill="#F7F6FE" stroke="#A9A3DB" stroke-width="0.8"/>
  <text x="570" y="218" text-anchor="middle"
    style="font-size:10px; font-weight:500; fill:#534AB7;">masked self-attention</text>
  <rect x="465" y="237" width="210" height="29" rx="7"
    fill="#FAEEDA" stroke="#BA7517" stroke-width="0.9"/>
  <text x="570" y="256" text-anchor="middle"
    style="font-size:10px; font-weight:600; fill:#633806;">cross-attention to encoder states</text>
  <rect x="465" y="275" width="210" height="29" rx="7"
    fill="#F7F6FE" stroke="#A9A3DB" stroke-width="0.8"/>
  <text x="570" y="294" text-anchor="middle"
    style="font-size:10px; font-weight:500; fill:#534AB7;">position-wise FFN</text>

  <path class="flow-original" d="M310 360 C385 360 378 251 460 251" fill="none"
    stroke="#BA7517" stroke-width="1.7" marker-end="url(#arrow-original)"/>
  <rect x="327" y="294" width="105" height="32" rx="8"
    fill="#FAEEDA" stroke="#BA7517" stroke-width="0.8"/>
  <text x="379.5" y="308" text-anchor="middle"
    style="font-size:9px; font-weight:600; fill:#633806;">cross-attention</text>
  <text x="379.5" y="320" text-anchor="middle"
    style="font-size:8px; fill:#854F0B;">source information</text>

  <line class="flow-original" x1="570" y1="309" x2="570" y2="332"
    stroke="#534AB7" stroke-width="1.4" marker-end="url(#arrow-original)"/>
  <rect x="450" y="336" width="240" height="48" rx="9"
    fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="570" y="356" text-anchor="middle"
    style="font-size:12px; font-weight:600; fill:#4A1B0C;">Next-token probabilities</text>
  <text x="570" y="373" text-anchor="middle"
    style="font-size:9px; fill:#993C1D;">choose a target token, then repeat</text>

  <text x="380" y="420" text-anchor="middle"
    style="font-size:10px; fill:#888780;">Residual connections and LayerNorm surround the sublayers in both stacks.</text>
  <text x="380" y="437" text-anchor="middle"
    style="font-size:9px; fill:#888780;">N = number of repeated layers; the original base model used N = 6.</text>
</svg>
