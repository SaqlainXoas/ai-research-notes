<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" role="img"
  style="font-family: ui-sans-serif, system-ui, sans-serif; background: transparent;">
  <title>Residual connections in an original Transformer encoder layer</title>
  <desc>Two Transformer sublayers are stacked vertically. Self-attention and the feed-forward network each have a learned branch and an identity shortcut that meet at addition, followed by LayerNorm. This represents the original Post-LN Transformer arrangement.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-shortcut" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      @keyframes flow-dash { to { stroke-dashoffset: -18; } }
      .flow { stroke-dasharray: 6 4; animation: flow-dash 1.5s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        .flow { animation: none !important; }
      }
    </style>
  </defs>

  <text x="440" y="31" text-anchor="middle"
    style="font-size:17px; font-weight:650; fill:#2C2C2A;">Original Transformer encoder layer: residual paths around both sublayers</text>
  <text x="440" y="53" text-anchor="middle"
    style="font-size:11px; fill:#888780;">The original design normalizes after each residual addition (Post-LN).</text>

  <text x="164" y="107" text-anchor="middle" style="font-size:11px; font-weight:600; fill:#0F6E56;">identity shortcut</text>
  <text x="164" y="126" text-anchor="middle" style="font-size:10px; fill:#0F6E56;">carries the sublayer input</text>

  <rect x="340" y="82" width="200" height="48" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="440" y="111" text-anchor="middle" style="font-size:14px; font-weight:600; fill:#2C2C2A;">Input representation x</text>

  <path d="M440 130 V158" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path class="flow" d="M340 106 H198 V271 H408" fill="none" stroke="#0F6E56" stroke-width="1.7" marker-end="url(#arrow-shortcut)"/>

  <rect x="300" y="158" width="280" height="78" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="440" y="188" text-anchor="middle" style="font-size:15px; font-weight:650; fill:#26215C;">Self-attention</text>
  <text x="440" y="211" text-anchor="middle" style="font-size:11px; fill:#534AB7;">learned sublayer transformation</text>
  <path d="M440 236 V254" fill="none" stroke="#534AB7" stroke-width="1.6" marker-end="url(#arrow)"/>

  <circle cx="440" cy="271" r="32" fill="#FAECE7" stroke="#993C1D" stroke-width="1.4"/>
  <path d="M426 271 H454 M440 257 V285" fill="none" stroke="#993C1D" stroke-width="2.2" stroke-linecap="round"/>
  <text x="490" y="275" style="font-size:11px; fill:#993C1D;">residual addition</text>
  <path d="M440 303 V325" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="325" width="280" height="54" rx="10" fill="#F8F6F0" stroke="#D9D4C8" stroke-width="1"/>
  <text x="440" y="357" text-anchor="middle" style="font-size:14px; font-weight:600; fill:#2C2C2A;">LayerNorm</text>
  <path d="M440 379 V411" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="164" y="421" text-anchor="middle" style="font-size:11px; font-weight:600; fill:#0F6E56;">identity shortcut</text>
  <text x="164" y="440" text-anchor="middle" style="font-size:10px; fill:#0F6E56;">carries the next sublayer input</text>
  <path class="flow" d="M440 379 V396 H198 V525 H408" fill="none" stroke="#0F6E56" stroke-width="1.7" marker-end="url(#arrow-shortcut)"/>

  <rect x="300" y="411" width="280" height="78" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="440" y="441" text-anchor="middle" style="font-size:15px; font-weight:650; fill:#04342C;">Feed-forward network</text>
  <text x="440" y="464" text-anchor="middle" style="font-size:11px; fill:#0F6E56;">learned sublayer transformation</text>
  <path d="M440 489 V508" fill="none" stroke="#0F6E56" stroke-width="1.6" marker-end="url(#arrow)"/>

  <circle cx="440" cy="525" r="32" fill="#FAECE7" stroke="#993C1D" stroke-width="1.4"/>
  <path d="M426 525 H454 M440 511 V539" fill="none" stroke="#993C1D" stroke-width="2.2" stroke-linecap="round"/>
  <text x="490" y="529" style="font-size:11px; fill:#993C1D;">residual addition</text>
  <path d="M440 557 V579" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="579" width="280" height="54" rx="10" fill="#F8F6F0" stroke="#D9D4C8" stroke-width="1"/>
  <text x="440" y="611" text-anchor="middle" style="font-size:14px; font-weight:600; fill:#2C2C2A;">LayerNorm</text>

  <rect x="610" y="583" width="220" height="40" rx="9" fill="#F8F6F0" stroke="#D9D4C8" stroke-width="1"/>
  <text x="720" y="607" text-anchor="middle" style="font-size:12px; font-weight:600; fill:#2C2C2A;">LayerNorm(x + Sublayer(x))</text>
</svg>
