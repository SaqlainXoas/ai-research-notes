<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc" style="font-family: ui-sans-serif, system-ui, sans-serif;">
  <title id="title">From pairwise BERT scoring to reusable Sentence-BERT embeddings</title>
  <desc id="desc">The left side shows a cross-encoder joining two sentences before BERT creates one score for that pair. The right side shows Sentence-BERT applying a shared encoder independently, pooling to vectors u and v, and comparing them with cosine similarity.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="760" height="500" fill="#F8F6F0"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="650" fill="#2C2A26">The architectural shift: score one pair or reuse sentence vectors</text>
  <text x="380" y="52" text-anchor="middle" font-size="12" fill="#68655E">Both use BERT-style encoders; the difference is joint token interaction versus comparison of independently encoded vectors.</text>

  <rect x="24" y="76" width="340" height="358" rx="14" fill="#F1EFE8" stroke="#D9D4C8"/>
  <text x="194" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#633806">PAIRWISE BERT / CROSS-ENCODER</text>
  <text x="194" y="124" text-anchor="middle" font-size="11" fill="#854F0B">interaction first → score for this pair</text>

  <rect x="55" y="147" width="278" height="57" rx="9" fill="#FAECE7" stroke="#993C1D"/>
  <text x="72" y="167" font-size="9" font-weight="700" fill="#993C1D">JOINED PAIR INPUT</text>
  <rect x="72" y="176" width="76" height="20" rx="5" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="110" y="190" text-anchor="middle" font-size="10" fill="#26215C">Sentence A</text>
  <text x="160" y="190" text-anchor="middle" font-size="11" fill="#77736B">+</text>
  <rect x="174" y="176" width="76" height="20" rx="5" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="212" y="190" text-anchor="middle" font-size="10" fill="#04342C">Sentence B</text>

  <line x1="194" y1="204" x2="194" y2="228" stroke="#993C1D" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="59" y="232" width="270" height="80" rx="10" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="194" y="261" text-anchor="middle" font-size="14" font-weight="650" fill="#26215C">BERT together</text>
  <text x="194" y="282" text-anchor="middle" font-size="11" fill="#534AB7">tokens can interact across the pair</text>
  <text x="194" y="299" text-anchor="middle" font-size="10" fill="#6D68A4">one joint forward pass</text>

  <line x1="194" y1="312" x2="194" y2="336" stroke="#993C1D" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="94" y="341" width="200" height="52" rx="10" fill="#FAEEDA" stroke="#BA7517"/>
  <text x="194" y="363" text-anchor="middle" font-size="12" font-weight="650" fill="#633806">pair score</text>
  <text x="194" y="380" text-anchor="middle" font-size="10" fill="#854F0B">belongs to A + B together</text>
  <text x="194" y="418" text-anchor="middle" font-size="10" font-weight="600" fill="#993C1D">new pair → run BERT again</text>

  <rect x="396" y="76" width="340" height="358" rx="14" fill="#F1EFE8" stroke="#D9D4C8"/>
  <text x="566" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#04342C">SENTENCE-BERT / BI-ENCODER</text>
  <text x="566" y="124" text-anchor="middle" font-size="11" fill="#0F6E56">encode independently → reusable vectors → compare</text>

  <rect x="416" y="147" width="94" height="31" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="463" y="167" text-anchor="middle" font-size="10" fill="#26215C">Sentence A</text>
  <rect x="622" y="147" width="94" height="31" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="669" y="167" text-anchor="middle" font-size="10" fill="#04342C">Sentence B</text>
  <line x1="463" y1="178" x2="463" y2="201" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="669" y1="178" x2="669" y2="201" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="409" y="205" width="108" height="55" rx="9" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="463" y="229" text-anchor="middle" font-size="11" font-weight="650" fill="#26215C">shared encoder</text>
  <text x="463" y="246" text-anchor="middle" font-size="9" fill="#534AB7">separate pass</text>
  <rect x="615" y="205" width="108" height="55" rx="9" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="669" y="229" text-anchor="middle" font-size="11" font-weight="650" fill="#04342C">shared encoder</text>
  <text x="669" y="246" text-anchor="middle" font-size="9" fill="#0F6E56">separate pass</text>
  <path d="M517 218 C549 190 583 190 615 218" fill="none" stroke="#BA7517" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="538" y="181" width="56" height="18" rx="5" fill="#FAEEDA" stroke="#BA7517"/>
  <text x="566" y="194" text-anchor="middle" font-size="8.5" fill="#633806">tied weights</text>

  <line x1="463" y1="260" x2="463" y2="280" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="669" y1="260" x2="669" y2="280" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="416" y="284" width="94" height="28" rx="7" fill="#F8F6F0" stroke="#BDB9AF"/>
  <text x="463" y="302" text-anchor="middle" font-size="10" fill="#4A4944">pool states</text>
  <rect x="622" y="284" width="94" height="28" rx="7" fill="#F8F6F0" stroke="#BDB9AF"/>
  <text x="669" y="302" text-anchor="middle" font-size="10" fill="#4A4944">pool states</text>

  <line x1="463" y1="312" x2="463" y2="329" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="669" y1="312" x2="669" y2="329" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="421" y="333" width="84" height="27" rx="7" fill="#E7E5FA" stroke="#534AB7"/>
  <text x="463" y="351" text-anchor="middle" font-size="10" font-weight="650" fill="#26215C">vector u</text>
  <rect x="627" y="333" width="84" height="27" rx="7" fill="#D8EFE7" stroke="#0F6E56"/>
  <text x="669" y="351" text-anchor="middle" font-size="10" font-weight="650" fill="#04342C">vector v</text>

  <path d="M463 360 C463 386 517 383 539 399" fill="none" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M669 360 C669 386 615 383 593 399" fill="none" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="521" y="394" width="90" height="29" rx="8" fill="#FAEEDA" stroke="#BA7517"/>
  <text x="566" y="413" text-anchor="middle" font-size="10" font-weight="650" fill="#633806">cosine(u, v)</text>

  <text x="566" y="455" text-anchor="middle" font-size="10" font-weight="600" fill="#0F6E56">vectors can be stored and reused</text>
  <text x="380" y="480" text-anchor="middle" font-size="10" fill="#77736B">Pooling and comparison functions can vary; independent encoding is the defining architectural change.</text>
</svg>
