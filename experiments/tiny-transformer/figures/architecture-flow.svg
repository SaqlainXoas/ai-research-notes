<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Tiny encoder-only Transformer classifier flow</title>
  <desc id="description">Token IDs pass through token and learned positional embeddings, one encoder block, CLS pooling, and a classifier to predict whether A occurs before B.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 600 24px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 17px Arial, sans-serif; fill: #0f172a; }
      .detail { font: 14px Arial, sans-serif; fill: #475569; }
      .small { font: 600 13px Arial, sans-serif; fill: #475569; letter-spacing: 0.08em; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="600" y="38" text-anchor="middle" class="title">One small encoder-only Transformer, end to end</text>

  <rect x="30" y="175" width="150" height="110" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="215" text-anchor="middle" class="label">Token IDs</text>
  <text x="105" y="242" text-anchor="middle" class="detail">[CLS] Y A X B Z Z</text>

  <path d="M180 230 H225" class="arrow"/>

  <rect x="230" y="175" width="180" height="110" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="210" text-anchor="middle" class="label">Token embeddings</text>
  <text x="320" y="238" text-anchor="middle" class="detail">one learned vector</text>
  <text x="320" y="258" text-anchor="middle" class="detail">per token</text>

  <path d="M410 230 H455" class="arrow"/>

  <rect x="460" y="175" width="185" height="110" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="552" y="208" text-anchor="middle" class="label">+ learned positions</text>
  <text x="552" y="238" text-anchor="middle" class="detail">order enters the</text>
  <text x="552" y="258" text-anchor="middle" class="detail">representation</text>

  <path d="M645 230 H688" class="arrow"/>

  <rect x="693" y="70" width="270" height="320" rx="18" fill="#faf5ff" stroke="#7e22ce" stroke-width="2.5"/>
  <text x="828" y="103" text-anchor="middle" class="small">ONE ENCODER BLOCK</text>
  <rect x="720" y="125" width="216" height="50" rx="10" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
  <text x="828" y="156" text-anchor="middle" class="label">Multi-head self-attention</text>
  <path d="M828 175 V204" class="arrow"/>
  <rect x="720" y="210" width="216" height="45" rx="10" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
  <text x="828" y="238" text-anchor="middle" class="label">Residual + LayerNorm</text>
  <path d="M828 255 V284" class="arrow"/>
  <rect x="720" y="290" width="216" height="45" rx="10" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
  <text x="828" y="318" text-anchor="middle" class="label">Feed-forward network</text>
  <path d="M828 335 V349" class="arrow"/>
  <rect x="720" y="354" width="216" height="24" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
  <text x="828" y="372" text-anchor="middle" class="detail">Residual + LayerNorm</text>

  <path d="M963 230 H1004" class="arrow"/>

  <rect x="1009" y="135" width="155" height="70" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1086" y="165" text-anchor="middle" class="label">Final [CLS]</text>
  <text x="1086" y="187" text-anchor="middle" class="detail">summary vector</text>

  <path d="M1086 205 V244" class="arrow"/>
  <rect x="1009" y="250" width="155" height="70" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1086" y="280" text-anchor="middle" class="label">Classifier</text>
  <text x="1086" y="302" text-anchor="middle" class="detail">two logits</text>

  <path d="M1086 320 V359" class="arrow"/>
  <text x="1086" y="390" text-anchor="middle" class="label">A before B?</text>
  <text x="1086" y="415" text-anchor="middle" class="detail">prediction: 0 or 1</text>
</svg>
