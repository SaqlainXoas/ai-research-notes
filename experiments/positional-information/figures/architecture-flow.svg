<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Positional information ablation</title>
  <desc id="desc">Tokens become token embeddings. The only branch is whether learned position embeddings are added before the same encoder and classifier.</desc>
  <style>
    .title { font: 700 25px Arial, sans-serif; fill: #0f172a; }
    .label { font: 700 16px Arial, sans-serif; fill: #0f172a; }
    .small { font: 14px Arial, sans-serif; fill: #334155; }
    .box { stroke: #94a3b8; stroke-width: 2; rx: 12; }
    .line { stroke: #64748b; stroke-width: 2.5; fill: none; }
    .head { fill: #64748b; }
  </style>
  <rect width="1000" height="360" fill="#f8fafc"/>
  <text x="500" y="40" text-anchor="middle" class="title">Only positional information changes</text>

  <rect x="55" y="145" width="140" height="54" class="box" fill="#dbeafe"/>
  <text x="125" y="178" text-anchor="middle" class="label">tokens</text>
  <line x1="195" y1="172" x2="235" y2="172" class="line"/>
  <polygon points="245,172 235,167 235,177" class="head"/>

  <rect x="250" y="145" width="190" height="54" class="box" fill="#dbeafe"/>
  <text x="345" y="178" text-anchor="middle" class="label">token embeddings</text>
  <line x1="440" y1="172" x2="475" y2="172" class="line"/>
  <circle cx="485" cy="172" r="4" fill="#64748b"/>

  <line x1="489" y1="172" x2="489" y2="110" class="line"/>
  <line x1="489" y1="110" x2="525" y2="110" class="line"/>
  <polygon points="535,110 525,105 525,115" class="head"/>
  <rect x="540" y="83" width="210" height="54" class="box" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/>
  <text x="645" y="116" text-anchor="middle" class="label">add position embeddings</text>

  <line x1="489" y1="172" x2="489" y2="234" class="line"/>
  <line x1="489" y1="234" x2="525" y2="234" class="line"/>
  <polygon points="535,234 525,229 525,239" class="head"/>
  <rect x="540" y="207" width="210" height="54" class="box" fill="#f1f5f9"/>
  <text x="645" y="240" text-anchor="middle" class="label">do not add positions</text>

  <line x1="750" y1="110" x2="785" y2="110" class="line"/>
  <line x1="785" y1="110" x2="785" y2="172" class="line"/>
  <line x1="750" y1="234" x2="785" y2="234" class="line"/>
  <line x1="785" y1="234" x2="785" y2="172" class="line"/>
  <line x1="785" y1="172" x2="810" y2="172" class="line"/>
  <polygon points="820,172 810,167 810,177" class="head"/>

  <rect x="825" y="145" width="135" height="54" class="box" fill="#e0e7ff"/>
  <text x="892" y="178" text-anchor="middle" class="label">same encoder</text>
  <line x1="892" y1="199" x2="892" y2="226" class="line"/>
  <polygon points="892,236 887,226 897,226" class="head"/>
  <rect x="805" y="241" width="175" height="54" class="box" fill="#ede9fe"/>
  <text x="892" y="274" text-anchor="middle" class="label">CLS classifier</text>

  <text x="645" y="290" text-anchor="middle" class="small">the only changed variable</text>
  <text x="500" y="338" text-anchor="middle" class="small">Dataset, initialization, encoder, classifier, optimizer, and training settings are held fixed.</text>
</svg>
