<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
  <title id="title">Single-component positional information ablation</title>
  <desc id="desc">The same token embeddings enter the same Tiny Transformer encoder and classifier. Only the addition of learned position embeddings changes between conditions.</desc>
  <defs>
    <style>
      .title { font: 700 25px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .small { font: 14px Arial, sans-serif; fill: #334155; }
      .box { stroke: #94a3b8; stroke-width: 2; rx: 12; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1000" height="380" fill="#f8fafc"/>
  <text x="500" y="42" text-anchor="middle" class="title">Only positional information changes</text>
  <rect x="55" y="130" width="150" height="54" class="box" fill="#dbeafe"/><text x="130" y="163" text-anchor="middle" class="label">tokens</text>
  <path d="M205 157 H250" class="arrow"/>
  <rect x="255" y="130" width="190" height="54" class="box" fill="#dbeafe"/><text x="350" y="163" text-anchor="middle" class="label">token embeddings</text>
  <path d="M445 157 H500" class="arrow"/>
  <rect x="505" y="85" width="225" height="54" class="box" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><text x="617" y="118" text-anchor="middle" class="label">+ position embeddings</text>
  <rect x="505" y="195" width="225" height="54" class="box" fill="#f1f5f9"/><text x="617" y="228" text-anchor="middle" class="label">no position added</text>
  <path d="M500 157 H480 V112 H500" class="arrow"/>
  <path d="M500 157 H480 V222 H500" class="arrow"/>
  <path d="M730 112 H765 V157 H790" class="arrow"/>
  <path d="M730 222 H765 V157" class="arrow"/>
  <rect x="795" y="130" width="150" height="54" class="box" fill="#e0e7ff"/><text x="870" y="163" text-anchor="middle" class="label">same encoder</text>
  <path d="M870 184 V220" class="arrow"/>
  <rect x="795" y="225" width="150" height="54" class="box" fill="#ede9fe"/><text x="870" y="257" text-anchor="middle" class="label">[CLS] → prediction</text>
  <text x="617" y="285" text-anchor="middle" class="small">only changed variable</text>
  <text x="500" y="342" text-anchor="middle" class="small">Dataset, initialization, encoder, classifier, optimizer, and training settings are held fixed.</text>
</svg>
